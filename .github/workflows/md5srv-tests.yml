name: MD5 Server Tests

on:
  workflow_dispatch:
  workflow_call:  # reusable workflow

permissions:
  contents: read

jobs:
  test-md5srv: # job id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
        TERM: xterm-256color
        MD5SRV_TIMEOUT: 5
        MD5SRV_DIR: ./test/hitl/scripts
    steps:
      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@4.0.0
        with:
            bats-install: true
            bats-version: 1.14.0
            # Outside $HOME the libraries' cache can't be restored without root.
            support-path: ${{ runner.temp }}/bats-support
            assert-path: ${{ runner.temp }}/bats-assert
            file-install: false
            detik-install: false
            github-token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run Tests
        id: run-tests
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
        run: |
            cd ${{env.MD5SRV_DIR}}
            bats -p --print-output-on-failure .
      - name: Re-run Tests
        if: failure() && steps.run-tests.outcome == 'failure'
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
        run: |
          cd ${{env.MD5SRV_DIR}}
          bats -p --print-output-on-failure -x .
